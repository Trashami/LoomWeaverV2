<button
  ngpButton
  type="button"
  class="lw-monster-card"
  [class.lw-monster-card--custom]="monster().isCustom"
  [class.lw-monster-card--in-collection]="inCollection()"
  [attr.aria-label]="'Open full details for ' + monster().name"
  (click)="monsterSelected.emit(monster())"
>
  <div class="lw-monster-card__thumb-wrap">
    <img
      class="lw-monster-card__thumb"
      [src]="resolvedImageUrl()"
      [alt]="monster().name"
      loading="lazy"
      (error)="onImageError()"
    />
  </div>

  <div class="lw-monster-card__body">
    <div class="lw-monster-card__head">
      <h3 class="lw-monster-card__title">{{ monster().name }}</h3>
      <span class="lw-monster-card__cr" [attr.data-tone]="crTone()">CR {{ monster().challengeRating }}</span>
    </div>

    <p class="lw-monster-card__desc">{{ monster().shortDescription }}</p>

    <div class="lw-monster-card__meta">
      <span class="lw-monster-card__stat">AC {{ monster().armorClass }}</span>
      @if (monster().hitPoints > 0) {
        <span class="lw-monster-card__stat">HP {{ monster().hitPoints }}</span>
      }
      @if (monster().isCustom) {
        <span class="lw-monster-card__credit">by {{ monster().creatorUsername }}</span>
      } @else {
        <span class="lw-monster-card__source">{{ monster().source }}</span>
      }
      @if (inCollection()) {
        <lw-badge label="In collection" tone="gold" />
      }
      @if (timesMet() > 0) {
        <lw-badge [label]="'Met ' + timesMet() + 'x'" tone="emerald" />
      }
    </div>
  </div>
</button>
