<div class="lw-page">
  <lw-page-header
    title="Music, Ambience & Adaptive Soundscape Studio"
    subtitle="Mix 4 harmonic audio stems in real time, trigger smooth scene crossfades, and synchronize table ambience."
    icon="Music"
  >
    <div pageActions class="lw-assets-actions">
      <lw-badge [label]="'Active Scene: ' + activePreset().name" tone="emerald" icon="Music" />
      <lw-badge [label]="lastSyncBanner()" tone="gold" />
      <a class="lw-action-link" routerLink="/arcane-screen">Open in Arcane Screen VTT</a>
    </div>
  </lw-page-header>

  <lw-panel [elevated]="true">
    <lw-audio-stem-mixer
      [isPlaying]="audio.isPlaying()"
      [activePresetId]="audio.activePresetId()"
      [masterVolume]="audio.masterVolume()"
      [stems]="audio.stems()"
      [presets]="audio.presets()"
      (togglePlaybackRequested)="audio.togglePlayback()"
      (presetTransitionRequested)="handlePresetTransition($event)"
      (stemGainChanged)="handleStemGainChange($event)"
      (masterVolumeChanged)="audio.setMasterVolume($event)"
    />
  </lw-panel>

  <lw-panel
    eyebrow="Canonical Asset Vault (/assets/map-assets)"
    title="Organized 3D Models, 2D Stamps, Terrain Textures & Packs"
    subtitle="Rendered with the shared lw-asset-card component across all entitlement-aware asset categories."
    icon="Layers"
  >
    <div panelActions class="lw-assets-actions">
      @for (cat of categories; track cat) {
        <lw-button
          [variant]="selectedCategory() === cat ? 'gold' : 'secondary'"
          size="sm"
          (pressed)="selectedCategory.set(cat)"
        >
          {{ cat }}
        </lw-button>
      }
    </div>

    <div class="lw-asset-grid">
      @for (asset of filteredAssets(); track asset.id) {
        <lw-asset-card
          [asset]="asset"
          [config]="{ variant: 'detailed', showPrice: true, showUnlockAction: true }"
          (assetSelected)="store.unlockAsset($event.id)"
          (unlockRequested)="store.unlockAsset($event.id)"
        />
      }
    </div>
  </lw-panel>
</div>
