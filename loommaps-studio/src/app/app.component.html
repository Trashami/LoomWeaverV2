<div class="lw-maps-shell">
  <lw-app-header-bar
    variant="studio"
    [campaigns]="store.campaigns()"
    [activeCampaign]="store.activeCampaign()"
    [activeCampaignId]="store.activeCampaignId()"
    [viewerRole]="store.viewerRole()"
    [loomOpen]="loomDrawerOpen()"
    [userDisplayName]="auth.currentUserProfile()?.displayName ?? 'Dungeon Master'"
    [userEmail]="auth.currentUserProfile()?.email ?? 'gm@loom-weaver.com'"
    [userTierCode]="auth.currentUserProfile()?.tierCode ?? 'weaver'"
    [generativeAiEnabled]="store.weaveEnabled()"
    [hideAiContent]="store.hideAiContent()"
    [experienceMode]="store.experienceMode()"
    (campaignSelected)="onCampaignSelected($event)"
    (viewerRoleToggled)="onToggleViewerRole()"
    (loomToggled)="loomDrawerOpen.set(!loomDrawerOpen())"
    (generativeAiToggled)="store.setGenerativeAiOptIn($event)"
    (hideAiContentToggled)="store.setHideAiContent($event)"
    (experienceModeChanged)="store.setExperienceMode($event)"
  />

  <nav class="lw-maps-mode" aria-label="LoomMaps workspace mode">
    <button ngpButton type="button" [attr.aria-pressed]="mode()==='battlemap'" (click)="setMode('battlemap')">Battlemap</button>
    <button ngpButton type="button" [attr.aria-pressed]="mode()==='atlas'" (click)="setMode('atlas')">World Atlas</button>
    <span>One campaign. From continents to encounters.</span>
  </nav>
  <main class="lw-maps-shell__main">
    <div class="lw-mode-pane" [hidden]="mode()!=='battlemap'"><lw-maps-page /></div>
    @if (atlasOpened()) {<div class="lw-mode-pane" [hidden]="mode()!=='atlas'"><lw-atlas-page /></div>}
  </main>

  @if (loomDrawerOpen()) {
    <aside class="lw-maps-shell__loom-drawer" aria-label="The Loom Campaign Memory Assistant">
      <lw-loom-launcher [generativeAiEnabled]="store.weaveEnabled()" />
    </aside>
  }
</div>
