<footer class="lw-viewport-bar" role="region" aria-label="Viewport Camera, Quality, and Grid Controls">
  <div class="lw-viewport-bar__group" role="group" aria-label="Camera & Renderer Mode">
    <button
      ngpButton
      type="button"
      class="lw-viewport-bar__mode-btn"
      [class.lw-viewport-bar__mode-btn--active]="activeView() === 'top-down'"
      (click)="selectView('top-down')"
    >
      <lw-icon name="grid_view" [size]="14" />
      <span>Top Down</span>
    </button>

    <button
      ngpButton
      type="button"
      class="lw-viewport-bar__mode-btn"
      [class.lw-viewport-bar__mode-btn--active]="activeView() === 'isometric'"
      (click)="selectView('isometric')"
    >
      <lw-icon name="view_in_ar" [size]="14" />
      <span>Isometric</span>
    </button>

    <button
      ngpButton
      type="button"
      class="lw-viewport-bar__mode-btn"
      [class.lw-viewport-bar__mode-btn--active]="activeView() === 'first-person'"
      (click)="selectView('first-person')"
    >
      <lw-icon name="visibility" [size]="14" />
      <span>First Person</span>
    </button>

    <button
      ngpButton
      type="button"
      class="lw-viewport-bar__mode-btn"
      [class.lw-viewport-bar__mode-btn--active]="activeView() === 'real-2d'"
      (click)="selectView('real-2d')"
      title="Locked overhead view with live lighting, assets and animation"
    >
      <lw-icon name="map" [size]="14" />
      <span>2D Live</span>
    </button>

    <button
      ngpButton
      type="button"
      class="lw-viewport-bar__mode-btn"
      [class.lw-viewport-bar__mode-btn--active]="activeView() === 'split-2d-3d'"
      (click)="selectView('split-2d-3d')"
      title="Simultaneous 2D and 3D synchronized viewports"
    >
      <lw-icon name="vertical_split" [size]="14" />
      <span>2D + 3D Split</span>
    </button>
  </div>

  <div class="lw-viewport-bar__group lw-viewport-bar__group--right">
    <label class="lw-viewport-bar__select-pill">
      <span class="lw-viewport-bar__select-label">Quality:</span>
      <select
        class="lw-viewport-bar__select"
        [value]="activeQuality()"
        (change)="onQualitySelect($event)"
        aria-label="Render Quality Preset"
      >
        @for (preset of qualityPresets(); track preset) {
          <option [value]="preset">{{ preset }}</option>
        }
      </select>
      <span class="lw-viewport-bar__fps-badge">{{ fps() }} FPS</span>
    </label>

    <label class="lw-viewport-bar__select-pill" title="Select 5ft Squares, 10ft Squares, Hex Grid, or Hide Grid">
      <lw-icon name="grid_4x4" [size]="13" />
      <span class="lw-viewport-bar__select-label">Grid:</span>
      <select
        class="lw-viewport-bar__select"
        [value]="gridSize()"
        (change)="onGridSizeSelect($event)"
        aria-label="Grid Mode"
      >
        <option value="5 ft">5 ft Squares</option>
        <option value="10 ft">10 ft Squares</option>
        <option value="Hex">Hex Grid</option>
        <option value="Off">Hide Grid (Off)</option>
      </select>
    </label>

    @if (gridSize() !== 'Off') {
      <label
        class="lw-viewport-bar__select-pill"
        title="Adjust 5ft Grid Squares across this World Plane without changing map bounds (rescales 5ft Reference Tokens)"
      >
        <span class="lw-viewport-bar__select-label">Squares:</span>
        <select
          class="lw-viewport-bar__select"
          [value]="gridSquaresAcross()"
          (change)="onGridSquaresSelect($event)"
          aria-label="5ft Grid Squares Across Map"
        >
          <option [value]="25">25×25 (125 ft)</option>
          <option [value]="35">35×35 (175 ft)</option>
          <option [value]="50">50×50 (250 ft)</option>
          <option [value]="64">64×64 (320 ft)</option>
          <option [value]="80">80×80 (400 ft)</option>
          <option [value]="100">100×100 (500 ft)</option>
        </select>
        <input
          type="range"
          min="50"
          max="200"
          step="5"
          [value]="gridScalePct()"
          (input)="onGridScaleInput($event)"
          aria-label="Grid Scale Percentage"
          style="width: 58px; accent-color: #49e892; cursor: pointer"
        />
        <span class="lw-viewport-bar__fps-badge">{{ gridSquaresAcross() }}×{{ gridSquaresAcross() }} sq</span>
      </label>
    }

    <button
      ngpButton
      type="button"
      class="lw-viewport-bar__toggle-pill"
      [class.lw-viewport-bar__toggle-pill--active]="snapEnabled()"
      (click)="snapToggle.emit()"
    >
      <lw-icon name="straighten" [size]="13" />
      <span>Snap: {{ snapEnabled() ? 'On' : 'Off' }}</span>
    </button>

    <button
      ngpButton
      type="button"
      class="lw-viewport-bar__toggle-pill"
      [class.lw-viewport-bar__toggle-pill--active]="hasRefTokens()"
      (click)="spawnTokensToggle.emit()"
      title="Spawn or clear draggable reference tokens to visualize movement, scale, and perspective"
    >
      <lw-icon name="users" [size]="13" />
      <span>{{ hasRefTokens() ? 'Ref Tokens: On' : 'Ref Tokens' }}</span>
    </button>

    <button
      ngpButton
      type="button"
      class="lw-viewport-bar__toggle-pill"
      [class.lw-viewport-bar__toggle-pill--active]="showPlayerSafeOnly()"
      (click)="playerSafeToggle.emit()"
      title="Preview player-safe view (hides GM secret geometry and discoveries)"
    >
      <lw-icon [name]="showPlayerSafeOnly() ? 'lock' : 'lock_open'" [size]="13" />
      <span>{{ showPlayerSafeOnly() ? 'Player Safe' : 'GM Full Canon' }}</span>
    </button>
  </div>
</footer>
