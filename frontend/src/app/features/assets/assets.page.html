<div class="lw-page">
  <lw-page-header
    title="Canonical Asset Vault"
    subtitle="Organized 3D Models, 2D Stamps, Terrain Textures & Packs (/assets/map-assets)."
    icon="Layers"
  >
    <div pageActions class="lw-assets-actions">
      <a class="lw-action-link lw-action-link--primary" routerLink="/music">Open Music Studio</a>
      <a class="lw-action-link" routerLink="/arcane-screen">Open in Arcane Screen VTT</a>
    </div>
  </lw-page-header>

  <lw-panel
    eyebrow="Asset Vault"
    title="Campaign Art, 3D Assets & Tactical Media"
    subtitle="Rendered with the shared lw-asset-card component across all entitlement-aware asset categories."
    icon="Layers"
  >
    <div panelActions class="lw-assets-actions">
      @for (cat of categories; track cat) {
        <lw-button
          [variant]="selectedCategory() === cat ? 'gold' : 'secondary'"
          size="sm"
          (pressed)="selectedCategory.set(cat)"
        >
          {{ cat }}
        </lw-button>
      }
    </div>

    <div class="lw-asset-grid">
      @for (asset of filteredAssets(); track asset.id) {
        <lw-asset-card
          [asset]="asset"
          [config]="{ variant: 'detailed', showPrice: true, showUnlockAction: true }"
          (assetSelected)="store.unlockAsset($event.id)"
          (unlockRequested)="store.unlockAsset($event.id)"
        />
      }
    </div>
  </lw-panel>
</div>
