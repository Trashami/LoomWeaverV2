@if (overlay.critVignetteState().outcome; as critVignetteOutcome) {
  <div
    class="lw-crit-screen-vignette"
    [class.lw-crit-screen-vignette--success]="critVignetteOutcome === 'nat20'"
    [class.lw-crit-screen-vignette--failure]="critVignetteOutcome === 'critfail'"
    [style.--lw-vignette-opacity]="overlay.critVignetteState().intensity"
    [style.--lw-vignette-inner-stop]="(1 - overlay.critVignetteState().spread) * 100 + '%'"
    aria-hidden="true"
  ></div>
}

<div
  class="lw-fs-dice-overlay"
  [class.lw-fs-dice-overlay--active]="overlay.overlayPhase() !== 'hidden'"
  [class.lw-fs-dice-overlay--interactive]="overlay.overlayPhase() !== 'hidden'"
  [attr.aria-hidden]="overlay.overlayPhase() === 'hidden'"
  [attr.inert]="overlay.overlayPhase() === 'hidden' ? '' : null"
  (click)="onBackdropClick()"
>
  <div
    class="lw-fs-dice-overlay__backdrop"
    [class.is-visible]="
      overlay.overlayPhase() === 'rolling' || overlay.overlayPhase() === 'settled'
    "
    [class.is-fading]="
      overlay.overlayPhase() === 'bg-fading' ||
      overlay.overlayPhase() === 'dice-hold' ||
      overlay.overlayPhase() === 'dice-fading' ||
      overlay.overlayPhase() === 'alert-hold' ||
      overlay.overlayPhase() === 'alert-fading'
    "
  ></div>

  <canvas
    #fullscreenDiceCanvas
    tabindex="-1"
    class="lw-fs-dice-overlay__canvas"
    [class.is-visible]="
      overlay.overlayPhase() === 'rolling' ||
      overlay.overlayPhase() === 'settled' ||
      overlay.overlayPhase() === 'bg-fading' ||
      overlay.overlayPhase() === 'dice-hold'
    "
    [class.is-fading]="
      overlay.overlayPhase() === 'dice-fading' ||
      overlay.overlayPhase() === 'alert-hold' ||
      overlay.overlayPhase() === 'alert-fading'
    "
  ></canvas>
</div>
