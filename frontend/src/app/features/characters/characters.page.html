<div class="lw-page">
  <lw-page-header title="Characters" subtitle="Create, level, and manage the characters in your campaign." icon="users" />

  @if (studio.viewMode() === 'creator') {
    <lw-character-creator-wizard
      [campaignName]="store.activeCampaign().name"
      [isEditMode]="studio.isEditingCharacter()"
      [draft]="studio.creatorDraft()"
      [ancestryOptions]="studio.catalog.ancestries()"
      [classOptions]="studio.catalog.classes()"
      [backgroundOptions]="studio.catalog.backgrounds()"
      [featOptions]="studio.catalog.feats()"
      [equipmentDatabase]="studio.catalog.equipmentDatabase()"
      [(activeStep)]="studio.creatorStep"
      [(sourceFilter)]="studio.ancestrySourceFilter"
      [(searchQuery)]="studio.ancestrySearchQuery"
      (draftPatched)="studio.updateCreatorDraft($event)"
      (abilityAdjusted)="studio.updateCreatorAbility($event.code, $event.delta)"
      (skillToggled)="studio.toggleCreatorSkill($event)"
      (completed)="studio.finalizeWizardCharacter()"
      (closed)="studio.openSheetViewer()"
    />
  } @else {
    @if (studio.activeSheet(); as activeSheet) {
      <lw-character-sheet-view
        [sheet]="activeSheet"
        [partyRoster]="studio.authorizedSheetsForActiveCampaign()"
        [equipmentDatabase]="studio.catalog.equipmentDatabase()"
        [spellDatabase]="studio.catalog.spellDatabase()"
        [mentionableEntities]="studio.catalog.mentionableEntities()"
        [(activeTab)]="studio.activeSheetTab"
        (characterSelected)="studio.selectCharacter($event, true)"
        (createCharacterRequested)="studio.openCreatorWizard()"
        (editCharacterRequested)="studio.openCreatorWizard($event)"
        (levelUpRequested)="studio.executeLevelUp($event.featureName, $event.abilityCode)"
        (portraitChangeRequested)="studio.cyclePortrait()"
        (portraitSelected)="studio.setActiveCharacterPortrait($event)"
        (abilityAdjusted)="studio.adjustAbility($event.code, $event.delta)"
        (equipmentToggled)="studio.toggleEquipment($event)"
        (equipmentAdded)="studio.addEquipmentFromDatabase($event.item, $event.equipNow)"
        (equipmentRemoved)="studio.removeEquipmentItem($event)"
        (spellPreparedToggled)="studio.toggleSpellPrepared($event)"
        (spellAdded)="studio.addSpellToActiveCharacter($event.spell, $event.prepared)"
        (connectionSelected)="onConnectionClicked($event)"
        (noteAdded)="studio.addCharacterNote($event)"
        (richNoteAdded)="studio.addRichCharacterNote($event)"
      />
    } @else {
      <p>No character is available for this campaign.</p>
    }
  }
</div>
