@if (open()) {
  <div
    class="lw-modal-backdrop"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="ariaLabel()"
    (click)="onBackdropClick($event)"
  >
    <div class="lw-modal" cdkTrapFocus [cdkTrapFocusAutoCapture]="true" [attr.data-size]="size()">
      <header class="lw-modal__header">
        <div class="lw-modal__heading">
          <ng-content select="[modalHeader]" />
        </div>
        <button
          ngpButton
          type="button"
          class="lw-modal__close"
          [attr.aria-label]="closeLabel()"
          (click)="close()"
        >
          <lw-icon name="close" [size]="18" />
        </button>
      </header>

      <div class="lw-modal__body">
        <ng-content />
      </div>

      <footer class="lw-modal__footer">
        <ng-content select="[modalFooter]" />
      </footer>
    </div>
  </div>
}
